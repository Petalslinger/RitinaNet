# CCTSDB2021 上 RetinaNet 的训练配置，命令行参数可覆盖本文件

data:
  root: data/processed/cctsdb
  num_classes: 3
  class_names:
    - mandatory
    - prohibitory
    - warning

model:
  # 8GB 显存建议 512/640；显存不足改 448/576
  min_size: 512
  max_size: 640
  # RetinaNet 的 ResNet50 只训练后 3 个 stage，节省显存
  trainable_backbone_layers: 3
  # Focal Loss
  focal_alpha: 0.25
  focal_gamma: 2.0

train:
  epochs: 12
  batch_size: 2
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  workers: 4
  amp: true
  seed: 42
  # true 时强制可复现的 cuDNN 算法（更慢，默认关闭）
  deterministic: false
  # 每个 epoch 验证时最多用多少张图，0 表示全量
  val_max_images: 800
  # 每多少个 epoch 验证一次
  val_every: 1
  # 梯度裁剪
  clip_grad: 10.0
  # 学习率调度：cosine
  scheduler: cosine
